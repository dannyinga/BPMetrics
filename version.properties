# The single source of truth for what version this is.
#
# Both modules read this. They must not carry their own numbers: phone and watch ship as two
# artifacts in one Play listing, and Play rejects a versionCode it has already seen — so two modules
# independently saying "1" cannot both be uploaded.
#
# versionName  What a user sees. Change it whenever you like.
# versionBase  Play's ordering. MUST increase for every release, and is never reused, even from a
#              release that was deleted. Bump it in the PR that opens a release.
#
# Each module derives its own code from versionBase so the two can never collide:
#   mobile = versionBase * 10       (10, 20, 30, ...)
#   wear   = versionBase * 10 + 1   (11, 21, 31, ...)
versionName=1.1.0
versionBase=1
