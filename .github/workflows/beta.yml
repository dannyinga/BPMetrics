name: Beta APK

# Sideloadable builds for people testing something before it reaches Play.
#
# Published as a GitHub *prerelease* on a public repository, so anyone with the link can download
# without an account. That is the whole point — Play's testing tracks are gated behind an upload
# key, a review and, on a personal developer account, twelve testers for a fortnight. This is the
# route that works today and keeps working for anyone you would rather not add to Play at all.
#
# The APKs carry `inga.bpmetrics.beta`, so they install alongside a Play copy rather than replacing
# it, with their own storage. See the `beta` build type for why.
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: beta-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build and publish beta
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # An unsigned APK cannot be installed, so unlike the Play workflows there is no useful
      # partial outcome here. Fail early and say why rather than publishing something inert.
      - name: Require signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. A beta APK has to be signed to be installable."
            exit 1
          fi

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      # Signed with the same key as everything else, which is safe here precisely because the
      # application id differs — there is no Play install for this package for it to conflict with.
      - name: Build beta APKs
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :mobile:assembleBeta :wear:assembleBeta --stacktrace

      - name: Collect APKs
        id: collect
        run: |
          mkdir -p dist
          cp mobile/build/outputs/apk/beta/*.apk "dist/BPMetrics-phone-beta-${{ github.run_number }}.apk"
          cp wear/build/outputs/apk/beta/*.apk "dist/BPMetrics-watch-beta-${{ github.run_number }}.apk"
          VERSION=$(grep -E '^versionName=' version.properties | cut -d= -f2- | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: Beta ${{ steps.collect.outputs.version }} (build ${{ github.run_number }})
          prerelease: true
          files: dist/*.apk
          body: |
            Test build from `${{ github.sha }}`.

            **Phone:** download `BPMetrics-phone-beta-*.apk` on the phone, tap it, and allow
            "install unknown apps" for your browser the first time.

            **Watch:** Wear OS has no browser, so the watch APK needs `adb` over Wi-Fi:
            enable wireless debugging on the watch, then
            `adb connect <watch-ip>` and `adb install BPMetrics-watch-beta-*.apk`.

            ---

            This installs as **BPMetrics Beta**, separate from any Play version — different app,
            different storage. Your real recordings are not touched, and the two can sit side by
            side.

            One consequence: the beta phone app only pairs with the beta watch app. Recordings from
            a watch running the Play build will not arrive here.

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
