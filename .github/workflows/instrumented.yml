name: Instrumented tests

# The Room migration tests. This project has twice shipped a migration whose SQL disagreed with the
# entities — a defect a fresh install cannot reveal, because a fresh install builds the schema from
# the entities and works perfectly. Only an upgrade fails, and only on someone else's phone.
#
# Those tests have existed for a while and have never once run automatically. This is that.
#
# Not on every feature push: an emulator costs several minutes, which is enough friction to
# discourage small commits. Gated on the branches where being wrong is expensive.
on:
  pull_request:
    branches: [production, staging, dev]
  push:
    branches: [production, staging]

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Migration and device tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # KVM is what makes an x86 emulator usable rather than glacial. Without it this job takes long
      # enough that people start skipping it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Booting a cold emulator is most of the runtime, so the booted snapshot is cached and reused.
      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-31

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Snapshot created"

      # API 31 matches the phone module's minSdk, so this exercises the oldest platform the app
      # claims to support rather than only the newest.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :mobile:connectedDebugAndroidTest --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: mobile/build/reports/androidTests/
          retention-days: 7
